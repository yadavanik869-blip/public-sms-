<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public SMS App</title>
    <!-- Firebase की लाइब्रेरी -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #e5edd8; }
        
        /* क्लासिक लॉगिन विंडो (Popup) */
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .modal-box h2 { margin-top: 0; color: #0066ff; font-size: 24px; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        .modal-box button { width: 100%; padding: 12px; background: #0066ff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* ओनर एडमिन पैनल मोडल */
        #admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .admin-box { background: #fff; width: 95%; max-width: 450px; height: 85vh; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .admin-header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .admin-controls { padding: 10px; background: #eee; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .admin-body { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; }
        .user-card { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }

        /* पासवर्ड बदलने का कस्टम डायलॉग बॉक्स */
        #password-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 10001; }
        .pass-box { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .pass-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
        .pass-btn-group { display: flex; justify-content: space-between; margin-top: 15px; }

        /* टॉप हेडर बार */
        .app-header { position: fixed; top: 0; left: 0; width: 100%; background: #0066ff; color: white; padding: 10px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-group { display: flex; gap: 4px; }
        .action-btn { background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .profile-btn { background: #28a745; }
        .owner-btn { background: #ffc107; color: #000; }

        /* इनपुट और सेंड बॉक्स */
        .input-container { position: fixed; top: 48px; left: 0; width: 100%; background: #ffffff; padding: 8px 15px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-container input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .input-container button { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* चैट इतिहास बॉक्स */
        #chat-history-box { margin-top: 105px; padding: 15px; display: flex; flex-direction: column; gap: 10px; min-height: calc(100vh - 105px); padding-bottom: 20px; }

        /* चैट बबल्स */
        .msg-container { display: flex; flex-direction: column; width: 100%; margin-bottom: 4px; }
        .my-row { align-items: flex-end; }
        .other-row { align-items: flex-start; }

        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; word-wrap: break-word; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg { background: #dcf8c6; border-top-right-radius: 0; text-align: left; }
        .other-msg { background: #ffffff; border-top-left-radius: 0; text-align: left; }
        
        .sender-name { font-size: 12px; color: #0066ff; margin-bottom: 3px; font-weight: bold; display: block; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 2px; }
    </style>
</head>
<body>

    <!-- क्लासिक लॉगिन विंडो -->
    <div id="login-modal" style="display: none;">
        <div class="modal-box">
            <h2>💬 Public SMS</h2>
            <p style="color: #555; font-size: 14px;">चैट में प्रवेश के लिए विवरण दें:</p>
            <input type="text" id="modalName" placeholder="अपना नाम दर्ज करें...">
            <input type="tel" id="modalPhone" placeholder="अपना मोबाइल नंबर दर्ज करें...">
            <button onclick="saveUserProfile()">प्रवेश करें 🚀</button>
        </div>
    </div>

    <!-- ओनर एडमिन पैनल विंडो -->
    <div id="admin-modal">
        <div class="admin-box">
            <div class="admin-header">
                <span>👑 ओनर कंट्रोल पैनल</span>
                <button onclick="closeAdminPanel()" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">X</button>
            </div>
            <div class="admin-controls">
                <span style="font-size:13px; font-weight:bold;">पासवर्ड सुरक्षा</span>
                <button onclick="openPasswordModal()" style="background:#007bff; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px;">🔑 पासवर्ड बदलें</button>
            </div>
            <div class="admin-body" id="admin-user-list">
                <p style="text-align:center; color:#775;">यूज़र्स लोड हो रहे हैं...</p>
            </div>
        </div>
    </div>

    <!-- पासवर्ड चेंज करने वाला कस्टम विंडो -->
    <div id="password-modal">
        <div class="pass-box">
            <h3 style="margin-top:0; color:#333; font-size:16px;">नया पासवर्ड सेट करें</h3>
            <input type="password" id="oldPassInput" placeholder="पुराना पासवर्ड डालें...">
            <input type="password" id="newPassInput" placeholder="नया पासवर्ड डालें...">
            <div class="pass-btn-group">
                <button onclick="closePasswordModal()" style="background:#6c757d; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Cancel</button>
                <button onclick="confirmChangePassword()" style="background:#28a745; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">OK</button>
            </div>
        </div>
    </div>

    <!-- टॉप हेडर और बटन्स -->
    <div class="app-header">
        <span>Public SMS 💬</span>
        <div class="btn-group">
            <button class="action-btn owner-btn" onclick="openAdminPanel()">👑 ओनर</button>
            <button class="action-btn profile-btn" onclick="openProfileModal()">⚙️</button>
            <button class="action-btn" onclick="clearLocalChat()">🗑️</button>
        </div>
    </div>
    
    <!-- इनपुट बॉक्स -->
    <div class="input-container">
        <input type="text" id="userInputMsg" placeholder="संदेश यहाँ लिखें... 🤖" onkeypress="checkEnter(event)">
        <button onclick="sendChatMessage()">SEND</button>
    </div>

    <!-- चैट बॉक्स -->
    <div id="chat-history-box">
        <div style="color: gray; text-align: center; margin-top: 20px;">चैट लोड हो रही है... 🤖✨</div>
    </div>

    <script>
        let myName = localStorage.getItem("user_profile_name");
        let myPhone = localStorage.getItem("user_profile_phone");
        let hiddenMessageIds = JSON.parse(localStorage.getItem("hidden_msg_ids")) || [];

        // डिफ़ॉल्ट ओनर पासवर्ड लोकल स्टोरेज में सेट करना
        if (!localStorage.getItem("owner_secret_pass")) {
            localStorage.setItem("owner_secret_pass", "amit89415");
        }

        if (!myName || !myPhone) {
            document.getElementById("login-modal").style.display = "flex";
        }

        function saveUserProfile() {
            let nameInput = document.getElementById("modalName").value.trim();
            let phoneInput = document.getElementById("modalPhone").value.trim();

            if (nameInput === "" || phoneInput === "") {
                alert("कृपया अपना नाम और मोबाइल नंबर दोनों दर्ज करें!");
                return;
            }

            let fullUser = nameInput + " (" + phoneInput + ")";
            localStorage.setItem("user_profile_name", fullUser);
            localStorage.setItem("user_profile_phone", phoneInput);
            
            db.collection("app_users").doc(phoneInput).set({
                name: nameInput,
                phone: phoneInput,
                fullProfile: fullUser,
                status: "Active",
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById("login-modal").style.display = "none";
            location.reload();
        }

        function openProfileModal() {
            let currentName = myName ? myName.split(" (")[0] : "";
            let currentPhone = myPhone || "";
            
            let newName = prompt("अपना नया नाम दर्ज करें:", currentName);
            if (newName && newName.trim() !== "") {
                let newPhone = prompt("अपना नया मोबाइल नंबर दर्ज करें:", currentPhone);
                if (newPhone && newPhone.trim() !== "") {
                    let fullUser = newName.trim() + " (" + newPhone.trim() + ")";
                    localStorage.setItem("user_profile_name", fullUser);
                    localStorage.setItem("user_profile_phone", newPhone.trim());
                    alert("प्रोफाइल अपडेट हो गई है!");
                    location.reload();
                }
            }
        }

        // ओनर पैनल ओपन करने का फंक्शन
        function openAdminPanel() {
            let pass = prompt("वेबसाइट ओनर पासवर्ड दर्ज करें:");
            let savedPass = localStorage.getItem("owner_secret_pass");
            if (pass === savedPass) {
                document.getElementById("admin-modal").style.display = "flex";
                loadAdminUsers();
            } else if (pass !== null) {
                alert("गलत पासवर्ड!");
            }
        }

        function closeAdminPanel() {
            document.getElementById("admin-modal").style.display = "none";
        }

        // पासवर्ड चेंज मोडल खोलना और बंद करना
        function openPasswordModal() {
            document.getElementById("oldPassInput").value = "";
            document.getElementById("newPassInput").value = "";
            document.getElementById("password-modal").style.display = "flex";
        }

        function closePasswordModal() {
            document.getElementById("password-modal").style.display = "none";
        }

        // नया पासवर्ड कन्फर्म करके सेव करना
        function confirmChangePassword() {
            let oldP = document.getElementById("oldPassInput").value;
            let newP = document.getElementById("newPassInput").value;
            let savedPass = localStorage.getItem("owner_secret_pass");

            if (oldP !== savedPass) {
                alert("पुराना पासवर्ड गलत है!");
                return;
            }
            if (newP.trim() === "") {
                alert("नया पासवर्ड खाली नहीं हो सकता!");
                return;
            }

            localStorage.setItem("owner_secret_pass", newP.trim());
            alert("पासवर्ड सफलतापूर्वक बदल दिया गया है!");
            closePasswordModal();
        }

        function loadAdminUsers() {
            let listDiv = document.getElementById("admin-user-list");
            db.collection("app_users").get().then((snapshot) => {
                listDiv.innerHTML = "";
                if(snapshot.empty) {
                    listDiv.innerHTML = "<p>कोई यूजर रजिस्टर नहीं है।</p>";
                    return;
                }
                snapshot.forEach((doc) => {
                    let u = doc.data();
                    let isBlocked = (u.status === "Blocked");
                    let btnText = isBlocked ? "Unblock 🟢" : "Block 🔴";
                    let btnColor = isBlocked ? "#28a745" : "#dc3545";

                    listDiv.innerHTML += `
                        <div class="user-card">
                            <div>
                                <b>${u.name}</b><br><small>${u.phone}</small><br>
                                <span style="font-size:10px; color:${isBlocked?'red':'green'}">Status: ${u.status}</span>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="toggleBlockUser('${doc.id}', '${u.status}')" style="background:${btnColor}; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">${btnText}</button>
                                <button onclick="viewUserChats('${u.fullProfile}')" style="background:#007bff; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">Chats 👁️</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function toggleBlockUser(phoneId, currentStatus) {
            let newStatus = (currentStatus === "Blocked") ? "Active" : "Blocked";
            db.collection("app_users").doc(phoneId).update({
                status: newStatus
            }).then(() => {
                loadAdminUsers();
            });
        }

        function viewUserChats(userProfileName) {
            db.collection("universal_apps_data").where("sender", "==", userProfileName).get().then((snapshot) => {
                let chatHistoryText = `=== ${userProfileName} के संदेश ===\n\n`;
                if(snapshot.empty) {
                    alert("इस यूजर का कोई संदेश नहीं है।");
                    return;
                }
                snapshot.forEach((doc) => {
                    let d = doc.data();
                    chatHistoryText += `- ${d.content} [ID: ${doc.id}]\n`;
                });
                
                let delId = prompt(chatHistoryText + "\nयदि आप कोई मैसेज डिलीट करना चाहते हैं, तो उसकी [ID] यहाँ डालें (अन्यथा खाली छोड़ें):");
                if (delId && delId.trim() !== "") {
                    db.collection("universal_apps_data").doc(delId.trim()).delete().then(() => {
                        alert("संदेश सफलतापूर्वक डिलीट कर दिया गया है!");
                    }).catch(err => alert("गलत आईडी या डिलीट करने में त्रुटि!"));
                }
            });
        }

        // Firebase कॉन्फ़िगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyDjceMDUUBHUuCebJUXZl-z-wyAdqdUpdY",
            authDomain: "public-sms.firebaseapp.com",
            projectId: "public-sms",
            storageBucket: "public-sms.firebasestorage.app",
            messagingSenderId: "638514138207",
            appId: "1:638514138207:web:0caa14eec9d4914e601fea",
            measurementId: "G-2CTK3Z6J3B"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const chatBox = document.getElementById("chat-history-box");

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function sendChatMessage() {
            let textMsg = document.getElementById("userInputMsg").value;
            if (textMsg.trim() === "") return;

            db.collection("app_users").doc(myPhone).get().then((doc) => {
                if (doc.exists && doc.data().status === "Blocked") {
                    alert("ओनर द्वारा आपको ब्लॉक कर दिया गया है, इसलिए आप संदेश नहीं भेज सकते!");
                    return;
                }

                db.collection("universal_apps_data").add({
                    sender: myName,
                    phone: myPhone,
                    content: textMsg,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    document.getElementById("userInputMsg").value = "";
                    
                    setTimeout(() => {
                        db.collection("universal_apps_data").add({
                            sender: "🤖 AI Bot",
                            content: "नया संदेश प्राप्त हुआ: \"" + textMsg + "\" 🚀",
                            time: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }, 1500);

                }).catch((error) => {
                    console.error("संदेश भेजने में त्रुटि: ", error);
                });
            });
        }

        function clearLocalChat() {
            db.collection("universal_apps_data").get().then((querySnapshot) => {
                hiddenMessageIds = [];
                querySnapshot.forEach((doc) => {
                    hiddenMessageIds.push(doc.id);
                });
                localStorage.setItem("hidden_msg_ids", JSON.stringify(hiddenMessageIds));
                renderChat(querySnapshot);
            });
        }

        db.collection("universal_apps_data").orderBy("time")
            .onSnapshot((snapshot) => {
                renderChat(snapshot);
            });

        function renderChat(snapshot) {
            chatBox.innerHTML = "";
            let visibleCount = 0;

            snapshot.forEach((doc) => {
                if (hiddenMessageIds.includes(doc.id)) return;

                let data = doc.data();
                visibleCount++;
                let isMine = (data.sender === myName);
                let rowClass = isMine ? "my-row" : "other-row";
                let bubbleClass = isMine ? "my-msg" : "other-msg";
                
                chatBox.innerHTML += `
                    <div class="msg-container ${rowClass}">
                        <div class="msg-bubble ${bubbleClass}">
                            <span class="sender-name">${data.sender || 'Unknown'}</span>
                            ${data.content}
                        </div>
                    </div>
                `;
            });

            if(visibleCount === 0) {
                chatBox.innerHTML = '<div style="color: gray; text-align: center; margin-top: 20px;">चैट शुरू करने के लिए मैसेज भेजें... 🤖✨</div>';
            }
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
    </html>
