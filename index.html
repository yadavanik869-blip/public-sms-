<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Public SMS App</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; font-family: sans-serif; background: #e5edd8; height: 100%; overflow: hidden; overscroll-behavior-y: none; }
        
        /* 3D Modern Modals */
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(3px); }
        .modal-card { background: #ffffff; padding: 25px; border-radius: 16px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); animation: popIn 0.3s ease; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-card h2 { margin-top: 0; color: #0066ff; font-size: 22px; font-weight: 800; }
        .modal-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; background: #f9f9f9; }
        .modal-btn-group { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-cancel { background: #6c757d; color: white; }
        .btn-ok { background: #28a745; color: white; }

        /* Admin & 3D Chat History Modal */
        #admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .admin-box { background: #fff; width: 95%; max-width: 450px; height: 85vh; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .admin-header { background: #222; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; }
        .admin-controls { padding: 12px; background: #f1f1f1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .admin-body { flex: 1; overflow-y: auto; padding: 15px; background: #eef2f7; }
        .user-card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
                /* 3D User Chat History Viewer */
        #user-chat-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10005; backdrop-filter: blur(5px); }
        .chat-viewer-box { background: #e5edd8; width: 95%; max-width: 450px; height: 85vh; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .chat-viewer-header { background: #0066ff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-viewer-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }

        .app-header { position: fixed; top: 0; left: 0; width: 100%; background: #0066ff; color: white; padding: 10px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-group { display: flex; gap: 4px; }
        .action-btn { background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .profile-btn { background: #28a745; }
        .owner-btn { background: #ffc107; color: #000; }

        .input-container { position: fixed; top: 48px; left: 0; width: 100%; background: #ffffff; padding: 8px 15px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-container input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .input-container button { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }

        #chat-history-box { position: absolute; top: 105px; bottom: 0; left: 0; width: 100%; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }

        .msg-container { display: flex; flex-direction: column; width: 100%; margin-bottom: 4px; }
        .my-row { align-items: flex-end; }
        .other-row { align-items: flex-start; }

        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; word-wrap: break-word; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg { background: #dcf8c6; border-top-right-radius: 0; text-align: left; }
        .other-msg { background: #ffffff; border-top-left-radius: 0; text-align: left; }
        
        .sender-name { font-size: 12px; color: #0066ff; margin-bottom: 3px; font-weight: bold; display: block; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 2px; }
        .msg-time { font-size: 10px; color: #666; margin-top: 4px; text-align: right; display: block; }
    </style>
</head>
<body>

    <!-- 3D Login Modal -->
    <div id="login-modal" class="custom-modal">
        <div class="modal-card">
            <h2>Public SMS 💬</h2>
            <p style="color: #555; font-size: 13px; font-weight: bold;">Enter Name & Access Password:</p>
            <input type="text" id="modalName" placeholder="Enter your name...">
            <input type="password" id="modalAccessPass" placeholder="Enter access password...">
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="cancelLogin()">Cancel</button>
                <button class="modal-btn btn-ok" onclick="saveUserProfile()">OK</button>
            </div>
        </div>
    </div>
        <!-- 3D Admin Panel Modal -->
    <div id="admin-modal">
        <div class="admin-box">
            <div class="admin-header">
                <span>👑 Owner Control Panel</span>
                <button onclick="closeAdminPanel()" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:bold;">X</button>
            </div>
            <div class="admin-controls">
                <span style="font-size:13px; font-weight:bold;">Security Settings</span>
                <button onclick="openPasswordModal()" style="background:#007bff; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;">Change Password</button>
            </div>
            <div class="admin-body" id="admin-user-list">
                <p style="text-align:center; color:#775;">Loading Users...</p>
            </div>
        </div>
    </div>

    <!-- 3D User Chat History Viewer Modal -->
    <div id="user-chat-modal">
        <div class="chat-viewer-box">
            <div class="chat-viewer-header">
                <span id="chat-viewer-title">User Chats</span>
                <button onclick="closeUserChatModal()" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:bold;">X</button>
            </div>
            <div class="chat-viewer-body" id="chat-viewer-content">
                <!-- Colorful 3D chat messages will render here -->
            </div>
        </div>
    </div>

    <!-- 3D Password Change Modal -->
    <div id="password-modal" class="custom-modal">
        <div class="modal-card">
            <h2>Change Password 🔑</h2>
            <input type="password" id="oldPassInput" placeholder="Enter old password...">
            <input type="password" id="newPassInput" placeholder="Enter new password...">
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closePasswordModal()">Cancel</button>
                <button class="modal-btn btn-ok" onclick="confirmChangePassword()">OK</button>
            </div>
        </div>
    </div>

    <!-- Top App Header -->
    <div class="app-header">
        <span>Public SMS 💬</span>
        <div class="btn-group">
            <button class="action-btn owner-btn" onclick="openAdminPassPrompt()">👑 Owner</button>
            <button class="action-btn profile-btn" onclick="openProfileModal()">⚙️</button>
            <button class="action-btn" onclick="clearLocalChat()">🗑️</button>
        </div>
    </div>
    
    <!-- Input Box -->
    <div class="input-container">
        <input type="text" id="userInputMsg" placeholder="Type message here... 🤖" onkeypress="checkEnter(event)">
        <button onclick="sendChatMessage()">SEND</button>
    </div>

    <!-- Chat Box -->
    <div id="chat-history-box">
        <div style="color: gray; text-align: center; margin-top: 20px;">Loading chat... 🤖✨</div>
    </div>

    <script>
        let myName = localStorage.getItem("user_profile_name");
        
        let myUniqueId = localStorage.getItem("user_unique_id");
        if (!myUniqueId) {
            myUniqueId = 'device_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
            localStorage.setItem("user_unique_id", myUniqueId);
        }

        let hiddenMessageIds = JSON.parse(localStorage.getItem("hidden_msg_ids")) || [];

        if (!localStorage.getItem("owner_secret_pass")) {
            localStorage.setItem("owner_secret_pass", "amit89415");
        }

        if (!myName) {
            document.getElementById("login-modal").style.display = "flex";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDjceMDUUBHUuCebJUXZl-z-wyAdqdUpdY",
            authDomain: "public-sms.firebaseapp.com",
            projectId: "public-sms",
            storageBucket: "public-sms.firebasestorage.app",
            messagingSenderId: "638514138207",
            appId: "1:638514138207:web:0caa14eec9d4914e601fea",
            measurementId: "G-2CTK3Z6J3B"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
                function cancelLogin() {
            alert("Access cancelled!");
            window.location.href = "about:blank";
        }

        function saveUserProfile() {
            let nameInput = document.getElementById("modalName").value.trim();
            let passInput = document.getElementById("modalAccessPass").value.trim();
            let currentOwnerPass = localStorage.getItem("owner_secret_pass");

            if (nameInput === "") {
                alert("Please enter your name!");
                return;
            }

            if (passInput !== currentOwnerPass) {
                alert("Incorrect Access Password! Please try again.");
                return;
            }

            localStorage.setItem("user_profile_name", nameInput);
            myName = nameInput;
            
            db.collection("app_users").add({
                name: nameInput,
                fullProfile: nameInput,
                deviceId: myUniqueId,
                status: "Active",
                joinedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById("login-modal").style.display = "none";
                location.reload();
            }).catch((error) => {
                console.error("Error saving user: ", error);
            });
        }

        function openProfileModal() {
            let passVerify = prompt("Enter access password to change name:");
            let currentOwnerPass = localStorage.getItem("owner_secret_pass");

            if (passVerify !== currentOwnerPass) {
                alert("Incorrect password! Name cannot be changed.");
                return;
            }

            let currentName = myName || "";
            let newName = prompt("Enter your new name:", currentName);
            
            if (newName && newName.trim() !== "") {
                localStorage.setItem("user_profile_name", newName.trim());
                myName = newName.trim();
                
                db.collection("app_users").add({
                    name: newName.trim(),
                    fullProfile: newName.trim(),
                    deviceId: myUniqueId,
                    status: "Active",
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("Profile updated and saved successfully!");
                    location.reload();
                });
            }
        }

        function openAdminPassPrompt() {
            let pass = prompt("Enter Website Owner Password:");
            let savedPass = localStorage.getItem("owner_secret_pass");
            if (pass === savedPass) {
                document.getElementById("admin-modal").style.display = "flex";
                loadAdminUsers();
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        }

        function closeAdminPanel() {
            document.getElementById("admin-modal").style.display = "none";
        }

        function openPasswordModal() {
            document.getElementById("oldPassInput").value = "";
            document.getElementById("newPassInput").value = "";
            document.getElementById("password-modal").style.display = "flex";
        }

        function closePasswordModal() {
            document.getElementById("password-modal").style.display = "none";
        }

        function confirmChangePassword() {
            let oldP = document.getElementById("oldPassInput").value;
            let newP = document.getElementById("newPassInput").value;
            let savedPass = localStorage.getItem("owner_secret_pass");

            if (oldP !== savedPass) {
                alert("Old password is incorrect!");
                return;
            }
            if (newP.trim() === "") {
                alert("New password cannot be empty!");
                return;
            }

            localStorage.setItem("owner_secret_pass", newP.trim());
            alert("Password successfully changed!");
            closePasswordModal();
        }

        function loadAdminUsers() {
            let listDiv = document.getElementById("admin-user-list");
            db.collection("app_users").orderBy("joinedAt", "desc").get().then((snapshot) => {
                listDiv.innerHTML = "";
                if(snapshot.empty) {
                    listDiv.innerHTML = "<p>No users registered yet.</p>";
                    return;
                }
                snapshot.forEach((doc) => {
                    let u = doc.data();
                    let isBlocked = (u.status === "Blocked");
                    let btnText = isBlocked ? "Unblock 🟢" : "Block 🔴";
                    let btnColor = isBlocked ? "#28a745" : "#dc3545";

                    listDiv.innerHTML += `
                        <div class="user-card">
                            <div>
                                <b>${u.name || 'Unknown'}</b><br>
                                <span style="font-size:10px; color:${isBlocked?'red':'green'}">Status: ${u.status || 'Active'}</span>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="toggleBlockUser('${doc.id}', '${u.status}')" style="background:${btnColor}; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold;">${btnText}</button>
                                <button onclick="viewUserChats3D('${u.fullProfile}')" style="background:#007bff; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold;">Chats 👁️</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function toggleBlockUser(docId, currentStatus) {
            let newStatus = (currentStatus === "Blocked") ? "Active" : "Blocked";
            db.collection("app_users").doc(docId).update({
                status: newStatus
            }).then(() => {
                loadAdminUsers();
            });
        }

        // 3D Colorful Chat Viewer Modal Logic for Owner
        function viewUserChats3D(userProfileName) {
            document.getElementById("chat-viewer-title").innerText = `${userProfileName} - Live Chats`;
            let contentBox = document.getElementById("chat-viewer-content");
            contentBox.innerHTML = "<p style='text-align:center;'>Loading chats...</p>";
            document.getElementById("user-chat-modal").style.display = "flex";

            db.collection("universal_apps_data").where("sender", "==", userProfileName).get().then((snapshot) => {
                contentBox.innerHTML = "";
                if(snapshot.empty) {
                    contentBox.innerHTML = "<p style='text-align:center; color:#775; margin-top:30px;'>No messages found for this user.</p>";
                    return;
                }
                snapshot.forEach((doc) => {
                    let d = doc.data();
                    contentBox.innerHTML += `
                        <div style="background:white; padding:10px 14px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); border-left:4px solid #0066ff; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <span style="font-size:11px; color:#555; font-weight:bold;">Message:</span>
                                <div style="font-size:14px; color:#333; font-weight:bold; margin-top:2px;">${d.content}</div>
                                <span style="font-size:9px; color:#888;">ID: ${doc.id}</span>
                            </div>
                            <button onclick="deleteSingleMessage('${doc.id}', '${userProfileName}')" style="background:#dc3545; color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.2);">Delete 🗑️</button>
                        </div>
                    `;
                });
            });
        }

        function closeUserChatModal() {
            document.getElementById("user-chat-modal").style.display = "none";
        }

        function deleteSingleMessage(msgId, userProfileName) {
            if(confirm("Are you sure you want to delete this message?")) {
                db.collection("universal_apps_data").doc(msgId).delete().then(() => {
                    alert("Message deleted successfully!");
                    viewUserChats3D(userProfileName);
                }).catch(err => alert("Error deleting message!"));
            }
        }

        const chatBox = document.getElementById("chat-history-box");

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function sendChatMessage() {
            let textMsg = document.getElementById("userInputMsg").value;
            if (textMsg.trim() === "") return;

            db.collection("app_users").where("name", "==", myName).get().then((querySnapshot) => {
                let isBlocked = false;
                querySnapshot.forEach((doc) => {
                    if (doc.data().status === "Blocked") isBlocked = true;
                });

                if (isBlocked) {
                    alert("You have been blocked by the owner, you cannot send messages!");
                    return;
                }

                db.collection("universal_apps_data").add({
                    sender: myName,
                    deviceId: myUniqueId,
                    content: textMsg,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    document.getElementById("userInputMsg").value = "";
                }).catch((error) => {
                    console.error("Error sending message: ", error);
                });
            });
        }

        function clearLocalChat() {
            db.collection("universal_apps_data").get().then((querySnapshot) => {
                hiddenMessageIds = [];
                querySnapshot.forEach((doc) => {
                    hiddenMessageIds.push(doc.id);
                });
                localStorage.setItem("hidden_msg_ids", JSON.stringify(hiddenMessageIds));
                renderChat(querySnapshot);
            });
        }

        db.collection("universal_apps_data").orderBy("time")
            .onSnapshot((snapshot) => {
                renderChat(snapshot);
            });

        function renderChat(snapshot) {
            chatBox.innerHTML = "";
            let visibleCount = 0;

            snapshot.forEach((doc) => {
                if (hiddenMessageIds.includes(doc.id)) return;

                let data = doc.data();
                visibleCount++;
                
                let isMine = (data.deviceId === myUniqueId || data.sender === myName);
                let rowClass = isMine ? "my-row" : "other-row";
                let bubbleClass = isMine ? "my-msg" : "other-msg";
                
                let timeString = "";
                if (data.time && data.time.toDate) {
                    let dateObj = data.time.toDate();
                    let optionsDate = { day: '2-digit', month: '2-digit', year: 'numeric' };
                    let optionsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
                    let formattedDate = dateObj.toLocaleDateString('hi-IN', optionsDate);
                    let formattedTime = dateObj.toLocaleTimeString('hi-IN', optionsTime);
                    timeString = `${formattedDate}, ${formattedTime}`;
                } else {
                    timeString = "Just now";
                }
                
                chatBox.innerHTML += `
                    <div class="msg-container ${rowClass}">
                        <div class="msg-bubble ${bubbleClass}">
                            <span class="sender-name">${data.sender || 'Unknown'}</span>
                            ${data.content}
                            <span class="msg-time">${timeString}</span>
                        </div>
                    </div>
                `;
            });

            if(visibleCount === 0) {
                chatBox.innerHTML = '<div style="color: gray; text-align: center; margin-top: 20px;">No messages yet. Start chatting... 🤖✨</div>';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
