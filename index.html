<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Public Live SMS App</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; background: #f0f2f5; }
        
        /* मुख्य लेआउट */
        .app-wrapper { display: flex; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }

        /* टॉप हेडर बार - हमेशा ऊपर फिक्स रहेगा */
        .app-header { background: #0066ff; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; height: 55px; flex-shrink: 0; z-index: 100; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        
        /* चैट इतिहास बॉक्स - केवल यही हिस्सा बीच में स्क्रॉल होगा */
        #chat-history-box { flex: 1; overflow-y: auto; padding: 15px; background: #e5edd8; display: flex; flex-direction: column; gap: 8px; }
        
        /* नीचे फिक्स रहने वाला इनपुट और सेंड एरिया - कभी गायब नहीं होगा */
        .input-container { background: #ffffff; padding: 10px 15px; display: flex; gap: 10px; border-top: 1px solid #ccc; height: 60px; flex-shrink: 0; z-index: 100; }
        .input-container input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; outline: none; }
        .input-container button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* मैसेज बबल्स का डिज़ाइन */
        .msg-bubble { background: #ffffff; padding: 8px 12px; border-radius: 6px; max-width: 75%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="app-header">
            <span>Public Live SMS App 💬</span>
            <button class="delete-btn" onclick="clearAllMessagesDirectly()">🗑️ डिलीट</button>
        </div>
        
        <div id="chat-history-box">
            <div style="color: gray; text-align: center; margin-top: 50px;">चैट लोड हो रही है... 🤖✨</div>
        </div>

        <div class="input-container">
            <input type="text" id="userInputMsg" placeholder="संदेश यहाँ लिखें... 🤖">
            <button onclick="sendChatMessage()">SEND</button>
        </div>
    </div>

    <script>
        // आपका सुरक्षित Firebase कॉन्फ़िगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyDjceMDUUBHUuCebJUXZl-z-wyAdqdUpdY",
            authDomain: "public-sms.firebaseapp.com",
            projectId: "public-sms",
            storageBucket: "public-sms.firebasestorage.app",
            messagingSenderId: "638514138207",
            appId: "1:638514138207:web:0caa14eec9d4914e601fea",
            measurementId: "G-2CTK3Z6J3B"
        };

        // Firebase इनिशियलाइज करें
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const chatBox = document.getElementById("chat-history-box");

        // मैसेज भेजने का फंक्शन
        function sendChatMessage() {
            let textMsg = document.getElementById("userInputMsg").value;
            if (textMsg.trim() === "") return;

            db.collection("universal_apps_data").add({
                content: textMsg,
                time: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById("userInputMsg").value = "";
            }).catch((error) => {
                console.error("संदेश भेजने में त्रुटि: ", error);
            });
        }

        // बिना किसी पॉप-अप के डायरेक्ट सारे मैसेज डिलीट करने का फंक्शन
        function clearAllMessagesDirectly() {
            db.collection("universal_apps_data").get().then((querySnapshot) => {
                let batch = db.batch();
                querySnapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                return batch.commit();
            }).then(() => {
                console.log("सारे मैसेज सफलतापूर्वक डिलीट हो गए!");
            }).catch((error) => {
                console.error("डिलीट करने में त्रुटि: ", error);
            });
        }

        // डेटा को लाइव सिंक करने और दिखाने का फंक्शन
        db.collection("universal_apps_data").orderBy("time")
            .onSnapshot((snapshot) => {
                chatBox.innerHTML = "";
                if(snapshot.empty) {
                    chatBox.innerHTML = '<div style="color: gray; text-align: center; margin-top: 50px;">चैट शुरू करने के लिए मैसेज भेजें... 🤖✨</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    chatBox.innerHTML += `<div class="msg-bubble">${data.content}</div>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
    </script>
</body>
</html>
